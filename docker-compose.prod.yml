services:
  api:
    image: ghcr.io/${GITHUB_OWNER}/my-api:sha-${REF}
    network_mode: host
    # The container runs as uid 1000; make sure ./api/data is writable by it
    volumes:
      - ./api/data:/app/api/data:rw,Z
    restart: unless-stopped
    environment:
      # Optional but recommended: require X-API-Key on every request
      - API_KEY=${API_KEY:-}
      # Optional: Discord channel webhook for the audit log (leave empty to disable)
      - AUDIT_LOG_WEBHOOK_URL=${AUDIT_LOG_WEBHOOK_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  
  bot:
    image: ghcr.io/${GITHUB_OWNER}/my-bot:sha-${REF}
    env_file: ./bot/.env
    network_mode: host
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
